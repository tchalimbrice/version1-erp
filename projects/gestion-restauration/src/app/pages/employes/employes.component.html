<div class="p-6 space-y-4">
  <div class="flex items-center justify-between flex-wrap gap-3">
    <h1 class="text-2xl font-bold text-gray-800">Employés</h1>
    <button class="px-4 py-2 bg-red-500 text-white rounded-lg text-sm font-semibold hover:bg-red-600 transition-colors">+ Nouvel employé</button>
  </div>

  <input type="text" [value]="search()" (input)="search.set($any($event.target).value)"
    placeholder="Rechercher un employé..."
    class="w-full max-w-sm border border-gray-200 rounded-lg px-4 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-red-300" />

  <div class="bg-white rounded-xl shadow-sm border border-gray-100 overflow-x-auto">
    <table class="w-full text-sm">
      <thead>
        <tr class="text-xs text-gray-400 font-semibold uppercase tracking-wide border-b border-gray-100">
          <th class="px-6 py-3 text-left">Nom</th>
          <th class="px-6 py-3 text-left">Poste</th>
          <th class="px-6 py-3 text-left">Téléphone</th>
          <th class="px-6 py-3 text-left">Statut</th>
          <th class="px-6 py-3 text-left">Actions</th>
        </tr>
      </thead>
      <tbody>
        @for (e of filtered(); track e.nom) {
          <tr class="border-b border-gray-50 hover:bg-gray-50 transition-colors">
            <td class="px-6 py-3 font-semibold text-gray-700">{{ e.nom }}</td>
            <td class="px-6 py-3 text-gray-600">{{ e.poste }}</td>
            <td class="px-6 py-3 text-gray-600">{{ e.tel }}</td>
            <td class="px-6 py-3">
              <span class="px-2 py-1 rounded-full text-xs font-semibold" [class]="statutClass(e.statut)">{{ e.statut }}</span>
            </td>
            <td class="px-6 py-3">
              <div class="flex gap-2">
                <button class="text-blue-500 hover:text-blue-700 text-xs font-medium">Modifier</button>
                <button class="text-red-400 hover:text-red-600 text-xs font-medium">Suppr.</button>
              </div>
            </td>
          </tr>
        }
      </tbody>
    </table>
  </div>
</div>
