<div class="p-6 space-y-6">
  <h1 class="text-2xl font-bold text-gray-800">Paramètres</h1>

  <!-- Tabs -->
  <div class="flex gap-1 flex-wrap border-b border-gray-200">
    @for (tab of tabs; track tab) {
      <button (click)="activeTab = tab"
        class="px-4 py-2.5 text-sm font-medium transition-colors border-b-2 -mb-px"
        [class.border-red-500]="activeTab === tab" [class.text-red-600]="activeTab === tab"
        [class.border-transparent]="activeTab !== tab" [class.text-gray-500]="activeTab !== tab">
        {{ tab }}
      </button>
    }
  </div>

  @if (activeTab === 'Général') {
    <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-6 max-w-2xl">
      <h2 class="text-base font-bold text-gray-700 mb-6">Informations générales</h2>
      <div class="space-y-4">
        <div>
          <label class="block text-sm font-semibold text-gray-600 mb-1">Nom du restaurant</label>
          <input type="text" [(ngModel)]="nomRestaurant"
            class="w-full border border-gray-200 rounded-lg px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-red-300" />
        </div>
        <div>
          <label class="block text-sm font-semibold text-gray-600 mb-1">Adresse</label>
          <input type="text" [(ngModel)]="adresse"
            class="w-full border border-gray-200 rounded-lg px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-red-300" />
        </div>
        <div class="grid sm:grid-cols-2 gap-4">
          <div>
            <label class="block text-sm font-semibold text-gray-600 mb-1">Téléphone</label>
            <input type="tel" [(ngModel)]="telephone"
              class="w-full border border-gray-200 rounded-lg px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-red-300" />
          </div>
          <div>
            <label class="block text-sm font-semibold text-gray-600 mb-1">Email</label>
            <input type="email" [(ngModel)]="email"
              class="w-full border border-gray-200 rounded-lg px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-red-300" />
          </div>
        </div>
        <div>
          <label class="block text-sm font-semibold text-gray-600 mb-1">Devise</label>
          <select [(ngModel)]="devise" class="w-full border border-gray-200 rounded-lg px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-red-300">
            @for (d of devises; track d) {
              <option [value]="d">{{ d }}</option>
            }
          </select>
        </div>
      </div>
      <div class="mt-6">
        <button (click)="save()" class="px-6 py-2.5 bg-red-500 text-white rounded-lg text-sm font-semibold hover:bg-red-600 transition-colors">
          Enregistrer les modifications
        </button>
      </div>
    </div>
  }

  @if (activeTab !== 'Général') {
    <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-12 text-center max-w-2xl">
      <p class="text-gray-400 text-sm">Section <strong>{{ activeTab }}</strong> — disponible prochainement.</p>
    </div>
  }
</div>
