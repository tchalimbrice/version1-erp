<div class="page"> <div class="page__header"> <div> <h1 class="page__title">Rendez-vous</h1> <p class="page__sub">{{ rdvs.length }} rendez-vous planifiés</p> </div> <button class="btn btn--primary" (click)="showForm.set(true)">+ Nouveau RDV</button> </div> <!-- Tabs --> <div class="tabs"> @for (t of tabs; track t) {
      <button class="tabs__btn" [class.tabs__btn--active]="activeTab() === t" (click)="activeTab.set(t)">{{ t }}</button> }
  </div> <div class="card" style="padding:0"> <table class="table"> <thead> <tr> <th>Patient</th> <th>Médecin</th> <th>Date</th> <th>Heure</th> <th>Motif</th> <th>Statut</th> </tr> </thead> <tbody> @for (r of filtered; track r.id) {
          <tr> <td class="fw-med">{{ r.patient }}</td> <td class="text-muted">{{ r.medecin }}</td> <td class="text-muted">{{ r.date }}</td> <td class="text-muted">{{ r.heure }}</td> <td class="text-muted">{{ r.motif }}</td> <td><span [class]="statutClass(r.statut)">{{ r.statut }}</span></td> </tr> }
      </tbody> </table> </div>
</div> @if (showForm()) {
  <div class="modal-overlay" (click)="showForm.set(false)"> <div class="modal" (click)="$event.stopPropagation()"> <div class="modal__head"> <span class="modal__title">Nouveau rendez-vous</span> <button class="modal__close" (click)="showForm.set(false)"></button> </div> <div class="modal__body"> <div class="field"> <label class="field__label">Patient</label> <input [(ngModel)]="form.patient" class="field__input" placeholder="Nom complet du patient" /> </div> <div class="field"> <label class="field__label">Médecin</label> <select [(ngModel)]="form.medecin" class="field__select"> <option value="">-- Sélectionner --</option> <option>Dr. Diallo</option> <option>Dr. Touré</option> <option>Dr. Kaboré</option> </select> </div> <div class="fields-row"> <div class="field"> <label class="field__label">Date</label> <input [(ngModel)]="form.date" type="date" class="field__input" /> </div> <div class="field"> <label class="field__label">Heure</label> <input [(ngModel)]="form.heure" type="time" class="field__input" /> </div> </div> <div class="field"> <label class="field__label">Motif</label> <input [(ngModel)]="form.motif" class="field__input" placeholder="Consultation, suivi, urgence…" /> </div> </div> <div class="modal__foot"> <button class="btn btn--outline" (click)="showForm.set(false)">Annuler</button> <button class="btn btn--primary" (click)="addRDV()">Enregistrer</button> </div> </div> </div>
}
