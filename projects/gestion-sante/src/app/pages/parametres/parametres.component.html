<div class="page"> <div class="page__header"> <div> <h1 class="page__title">Paramètres</h1> <p class="page__sub">Configuration de votre établissement de santé</p> </div> </div> @if (saved) {
    <div class="alert-success"> Modifications enregistrées avec succès.</div> }

  <div class="card"> <div class="card__head"><span class="card__title">Informations de la clinique</span></div> <div class="settings-grid"> <div class="field"> <label class="field__label">Nom de l'établissement</label> <input [(ngModel)]="clinique.nom" class="field__input" placeholder="Clinique Santé Plus" /> </div> <div class="field"> <label class="field__label">Responsable / Médecin chef</label> <input [(ngModel)]="clinique.responsable" class="field__input" placeholder="Dr. Koné Abdoulaye" /> </div> <div class="field"> <label class="field__label">Adresse</label> <input [(ngModel)]="clinique.adresse" class="field__input" placeholder="Abidjan, Cocody" /> </div> <div class="field"> <label class="field__label">Agrément sanitaire</label> <input [(ngModel)]="clinique.agrementSanitaire" class="field__input" placeholder="N° AS-CI-2024-XXX" /> </div> <div class="field"> <label class="field__label">Téléphone</label> <input [(ngModel)]="clinique.telephone" class="field__input" placeholder="07 00 00 00" /> </div> <div class="field"> <label class="field__label">Email</label> <input [(ngModel)]="clinique.email" type="email" class="field__input" placeholder="contact@clinique.ci" /> </div> </div> <div class="field" style="margin-top:12px"> <label class="field__label">Spécialités proposées</label> <textarea [(ngModel)]="clinique.specialites" class="field__textarea" rows="2"></textarea> </div> </div> <div class="card"> <div class="card__head"><span class="card__title">Horaires d'ouverture</span></div> <div class="horaires-grid"> @for (jour of ['Lundi','Mardi','Mercredi','Jeudi','Vendredi','Samedi']; track jour) {
        <div class="horaire-row"> <span class="horaire-jour">{{ jour }}</span> <span class="horaire-val">08h00 – 18h00</span> </div> }
      <div class="horaire-row"> <span class="horaire-jour">Dimanche</span> <span class="badge badge--red">Fermé</span> </div> </div> </div> <div class="page__actions"> <button class="btn btn--primary" (click)="save()">Enregistrer les modifications</button> </div>
</div>
