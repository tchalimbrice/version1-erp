<div class="settings-page">
  <aside class="sidebar">
    <div class="brand">
      <div class="brand__logo">M</div>
      <div>
        <h1>Ma Ferme</h1>
        <p>Gestion de ferme</p>
      </div>
    </div>

    <nav class="menu" aria-label="Navigation principale">
      @for (link of links; track link.path) {
        <a class="menu__item" [routerLink]="link.path" [class.menu__item--active]="link.path === '/parametres'">
          {{ link.label }}
        </a>
      }
    </nav>
  </aside>

  <main class="settings-card">
    <header class="topbar">
      <div>
        <h2>Parametres</h2>
      </div>
    </header>

    <section class="settings-grid">
      @for (card of cards; track card.title) {
        <button class="setting-tile" type="button" [attr.data-tone]="card.tone">
          <div class="setting-tile__icon">{{ card.icon }}</div>
          <div class="setting-tile__content">
            <h3>{{ card.title }}</h3>
            <p>{{ card.description }}</p>
          </div>
        </button>
      }
    </section>
  </main>
</div>
