<div class="auth-page"> <div class="auth-card"> <div class="title-block"> <h2>Créer un compte</h2> <p>Inscrivez votre entreprise agricole</p> </div> <form class="form" (submit)="$event.preventDefault(); register()"> <label class="field"> <span>Nom de l'entreprise</span> <input type="text" name="companyName" [(ngModel)]="companyName" placeholder="Ex: Ferme du Bonheur" /> </label> <div class="two-cols"> <label class="field"> <span>Nom du Propriétaire</span> <input type="text" name="ownerName" [(ngModel)]="ownerName" placeholder="Votre nom complet" /> </label> <label class="field"> <span>Téléphone</span> <input type="tel" name="phone" [(ngModel)]="phone" placeholder="+237 6XX XXX XXX" /> </label> </div> <label class="field"> <span>Email</span> <input type="email" name="email" [(ngModel)]="email" placeholder="votre@email.com" /> </label> <div class="two-cols"> <label class="field"> <span>Mot de passe</span> <div class="password"> <input type="password" name="password" [(ngModel)]="password" placeholder="Créer un mot de passe" /> <span class="password__icon" aria-hidden="true">??</span> </div> </label> <label class="field"> <span>Confirmer le mot de passe</span> <div class="password"> <input type="password" name="confirmPassword" [(ngModel)]="confirmPassword" placeholder="Confirmer le mot de passe" /> <span class="password__icon" aria-hidden="true">??</span> </div> </label> </div> <label class="field"> <span>Adresse de la Ferme</span> <input type="text" name="address" [(ngModel)]="address" placeholder="Localisation de votre ferme" /> </label> <label class="checkbox"> <input type="checkbox" /> <span> J'accepte les <a class="link" href="#">Conditions d'utilisation</a> et la
          <a class="link" href="#">Politique de confidentialité</a> </span> </label> <p class="error" *ngIf="error">{{ error }}</p> <button class="submit" type="submit">Inscrire l'entreprise</button> <p class="signup"> Déjà un compte ?
        <a class="link" routerLink="/connexion">Se connecter</a> </p> </form> </div>
</div>
