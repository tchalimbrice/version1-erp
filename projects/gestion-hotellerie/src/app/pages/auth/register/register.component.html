<main class="register"> <section class="card"> <h1>Créer une entreprise</h1> <p class="subtitle">Hôtellerie – configuration initiale</p> <form class="form" (submit)="$event.preventDefault(); submit()"> <label class="field"> <span>Nom de l’entreprise *</span> <input name="companyName" [(ngModel)]="companyName" type="text" placeholder="Ex: Hôtel Bellevue" /> </label> <label class="field"> <span>Adresse</span> <input name="address" [(ngModel)]="address" type="text" /> </label> <label class="field"> <span>Téléphone</span> <input name="phone" [(ngModel)]="phone" type="tel" /> </label> <label class="field"> <span>Email administrateur *</span> <input name="email" [(ngModel)]="email" type="email" /> </label> <label class="field"> <span>Mot de passe *</span> <input name="password" [(ngModel)]="password" type="password" /> </label> <label class="field"> <span>Confirmer le mot de passe *</span> <input name="confirmPassword" [(ngModel)]="confirmPassword" type="password" /> </label> <div class="row"> <label class="checkbox"> <input type="checkbox" [(ngModel)]="accepted" name="accepted" /> <span>J’accepte les conditions</span> </label> <select class="select" name="mode" [(ngModel)]="mode"> <option value="centralized">Centralisé</option> <option value="collaborative">Collaboratif</option> </select> </div> <p class="error" *ngIf="error">{{ error }}</p> <button class="submit" type="submit">Continuer</button> <p class="muted"> Déjà un lien unique ?
        <a routerLink="/connexion" class="link">Se connecter</a> </p> </form> </section>
</main>
