<div class="page"> <div class="page-header"> <div> <h1>Paramètres</h1> <p class="page-sub">Configurez les informations de votre établissement</p> </div> @if (saved) {
      <div class="toast"> Modifications enregistrées</div> }
  </div> <!-- Hotel info --> <div class="section"> <div class="section__title">Informations de l'hôtel</div> <div class="form-grid"> <label class="field field--wide"> <span>Nom de l'établissement</span> <input type="text" [(ngModel)]="hotel.nom" placeholder="Hôtel Bellevue" /> </label> <label class="field field--wide"> <span>Adresse</span> <input type="text" [(ngModel)]="hotel.adresse" placeholder="12 rue de la Paix, Paris" /> </label> <label class="field"> <span>Téléphone</span> <input type="tel" [(ngModel)]="hotel.telephone" placeholder="+33 1 23 45 67 89" /> </label> <label class="field"> <span>Email</span> <input type="email" [(ngModel)]="hotel.email" placeholder="contact@hotel.fr" /> </label> <label class="field"> <span>Classement (étoiles)</span> <select [(ngModel)]="hotel.etoiles"> <option [value]="1">&#9733; 1 étoile</option> <option [value]="2">&#9733;&#9733; 2 étoiles</option> <option [value]="3">&#9733;&#9733;&#9733; 3 étoiles</option> <option [value]="4">&#9733;&#9733;&#9733;&#9733; 4 étoiles</option> <option [value]="5">&#9733;&#9733;&#9733;&#9733;&#9733; 5 étoiles</option> </select> </label> <label class="field"> <span>Devise</span> <select [(ngModel)]="hotel.devise"> <option>EUR</option><option>USD</option><option>XOF</option> </select> </label> </div> </div> <!-- Horaires --> <div class="section"> <div class="section__title">Horaires</div> <div class="form-grid"> <label class="field"> <span>Check-in (heure d'arrivée)</span> <input type="time" [(ngModel)]="hotel.checkIn" /> </label> <label class="field"> <span>Check-out (heure de départ)</span> <input type="time" [(ngModel)]="hotel.checkOut" /> </label> </div> </div> <button class="btn btn--primary" (click)="save()">Enregistrer les modifications</button>
</div>
