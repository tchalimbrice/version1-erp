<main class="page"> <section class="card"> <h1>Informations des collaborateurs</h1> <p>Renseignez les informations puis générez les liens uniques.</p> <div class="grid"> <div *ngFor="let c of collaborators" class="collab-card"> <div class="role">Poste : {{ c.role }}</div> <div class="fields"> <input [(ngModel)]="c.firstName" placeholder="Prénom" /> <input [(ngModel)]="c.lastName" placeholder="Nom" /> <input [(ngModel)]="c.email" placeholder="Email" /> <input [(ngModel)]="c.password" type="password" placeholder="Mot de passe" /> </div> <div *ngIf="generated" class="token"> Lien unique :
          <div class="link">{{ c.inviteUrl }}</div> </div> </div> </div> <div *ngIf="generated && ownerInviteUrl" class="token" style="margin-top: 12px;"> Lien chef d’entreprise :
      <div class="link">{{ ownerInviteUrl }}</div> </div> <div class="actions"> <button class="primary" type="button" (click)="generateLinks()">Générer les liens</button> <button class="secondary" type="button" (click)="finish()" *ngIf="generated">Terminer</button> </div> </section>
</main>
