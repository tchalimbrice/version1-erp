<main class="min-h-screen bg-gray-50 px-6 py-10"> <div class="max-w-5xl mx-auto"> <a [routerLink]="returnRoute" class="inline-block mb-4 text-sm text-primary">&#8592; Retour</a> <nav class="flex flex-wrap gap-3 mb-6"> <a routerLink="/trajets"class="px-4 py-2 rounded border text-sm font-medium">Trajets</a> <a routerLink="/vehicules"class="px-4 py-2 rounded border text-sm font-medium">Véhicules</a> <a routerLink="/transport-assign" class="px-4 py-2 rounded border bg-white text-sm font-semibold shadow-sm">Affectations</a> <a routerLink="/maintenance"class="px-4 py-2 rounded border text-sm font-medium">Maintenance</a> <a routerLink="/suivi"class="px-4 py-2 rounded border text-sm font-medium">Suivi</a> <a routerLink="/passagers"class="px-4 py-2 rounded border text-sm font-medium">Passagers</a> </nav> <!-- Form --> <div class="bg-white rounded-xl border shadow-sm p-6 mb-6"> <h1 class="text-lg font-bold mb-4">Affecter un trajet</h1> <div class="grid md:grid-cols-3 gap-4 mb-4"> <div> <label class="block text-xs font-semibold text-gray-500 mb-1">Trajet</label> <select [(ngModel)]="form.trajet" class="w-full border rounded-lg px-3 py-2 text-sm"> <option value="">-- Sélectionner --</option> <option>Abidjan → Bouaké</option> <option>Bouaké → Korhogo</option> <option>Abidjan → San Pedro</option> <option>Abidjan → Yamoussoukro</option> </select> </div> <div> <label class="block text-xs font-semibold text-gray-500 mb-1">Véhicule</label> <select [(ngModel)]="form.vehicule" class="w-full border rounded-lg px-3 py-2 text-sm"> <option value="">-- Sélectionner --</option> <option>AB-1234-CI – Mercedes Sprinter</option> <option>CD-5678-CI – Toyota Coaster</option> <option>EF-9012-CI – Iveco Daily</option> </select> </div> <div> <label class="block text-xs font-semibold text-gray-500 mb-1">Chauffeur</label> <select [(ngModel)]="form.chauffeur" class="w-full border rounded-lg px-3 py-2 text-sm"> <option value="">-- Sélectionner --</option> <option>Alona Rarth</option> <option>Dohn Maxan</option> <option>Koné Ibrahim</option> </select> </div> </div> <div class="grid md:grid-cols-2 gap-4 mb-4"> <div> <label class="block text-xs font-semibold text-gray-500 mb-1">Date de départ</label> <input [(ngModel)]="form.date" type="date" class="w-full border rounded-lg px-3 py-2 text-sm" /> </div> <div> <label class="block text-xs font-semibold text-gray-500 mb-1">Heure</label> <input [(ngModel)]="form.heure" type="time" class="w-full border rounded-lg px-3 py-2 text-sm" /> </div> </div> <button (click)="assign()" class="px-5 py-2 bg-primary text-white rounded-lg text-sm font-semibold">Affecter</button> </div> <!-- Affectations list --> <div class="bg-white rounded-xl border shadow-sm overflow-hidden"> <div class="px-6 py-4 border-b font-bold text-base">Affectations en cours</div> <table class="w-full text-sm"> <thead class="bg-gray-50 text-xs text-gray-500 uppercase tracking-wide"> <tr> <th class="text-left px-6 py-3">Trajet</th> <th class="text-left px-6 py-3">Véhicule</th> <th class="text-left px-6 py-3">Chauffeur</th> <th class="text-left px-6 py-3">Date</th> <th class="text-left px-6 py-3">Heure</th> <th class="text-left px-6 py-3">Statut</th> </tr> </thead> <tbody class="divide-y divide-gray-50"> @for (a of affectations; track a.id) {
            <tr class="hover:bg-gray-50"> <td class="px-6 py-3 font-medium">{{ a.trajet }}</td> <td class="px-6 py-3 text-gray-600">{{ a.vehicule }}</td> <td class="px-6 py-3 text-gray-600">{{ a.chauffeur }}</td> <td class="px-6 py-3 text-gray-600">{{ a.date }}</td> <td class="px-6 py-3 text-gray-600">{{ a.heure }}</td> <td class="px-6 py-3"> <span class="px-2 py-1 rounded-full text-xs font-bold bg-green-100 text-green-700">Planifié</span> </td> </tr> }
        </tbody> </table> </div> </div>
</main>
