<main class="min-h-screen bg-gray-50 px-6 py-10"> <div class="max-w-5xl mx-auto"> <a [routerLink]="returnRoute" class="inline-block mb-4 text-sm text-primary">← Retour</a> <nav class="flex gap-3 mb-4"> <a routerLink="/tickets" class="px-4 py-2 rounded border">Vente de tickets</a> <a routerLink="/tickets-vendus" class="px-4 py-2 rounded border bg-white">Tickets vendus</a> </nav> <div class="bg-white rounded-xl border shadow p-6"> <h1 class="text-xl font-bold mb-4">Tickets vendus</h1> <div *ngIf="store.ticketSales().length === 0" class="text-sm text-text-secondary"> Aucun ticket vendu pour le moment.
      </div> <div class="grid gap-3" *ngIf="store.ticketSales().length > 0"> <div class="p-4 border rounded-lg" *ngFor="let t of store.ticketSales()"> <div class="flex justify-between"> <div class="font-medium">{{ t.clientName }}</div> <div class="text-sm text-text-secondary">{{ t.soldAt | date: 'short' }}</div> </div> <div class="text-sm text-text-secondary"> Trajet : {{ t.route }} · Date : {{ t.date }} · Passagers : {{ t.passengers }}
          </div> <div class="text-sm"> Total : <strong>{{ t.total }}</strong> · Vendu par : {{ t.soldBy }}
          </div> </div> </div> </div> </div>
</main>
