<main class="min-h-screen bg-gray-50 px-6 py-10"> <div class="max-w-5xl mx-auto"> <a [routerLink]="returnRoute" class="inline-block mb-4 text-sm text-primary">← Retour</a> <div class="flex items-center justify-between mb-4"> <h1 class="text-xl font-bold">Liste des passagers</h1> <button (click)="exportPdf()" class="px-4 py-2 bg-primary text-white rounded">Exporter PDF</button> </div> <div class="mb-4"> <label class="text-sm text-text-secondary">Trajet</label> <select [(ngModel)]="routeFilter" class="ml-2 px-3 py-2 border rounded"> <option value="">Tous</option> <option *ngFor="let r of routes" [value]="r">{{ r }}</option> </select> </div> <div class="bg-white rounded-xl border shadow p-4"> <div *ngIf="filteredSales.length === 0" class="text-sm text-text-secondary"> Aucun passager pour ce trajet.
      </div> <table *ngIf="filteredSales.length > 0" class="w-full text-sm"> <thead> <tr class="text-left border-b"> <th class="py-2">Client</th> <th>Trajet</th> <th>Bus</th> <th>Chauffeur</th> <th>Date</th> </tr> </thead> <tbody> <tr *ngFor="let s of filteredSales" class="border-b"> <td class="py-2">{{ s.clientName }}</td> <td>{{ s.route }}</td> <td>{{ s.busPlate }}</td> <td>{{ s.driverName }}</td> <td>{{ s.date }}</td> </tr> </tbody> </table> </div> </div>
</main>
