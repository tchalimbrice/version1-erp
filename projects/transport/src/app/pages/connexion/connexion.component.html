<main class="login-page"> <div class="bg-img"></div> <section class="card"> <div class="brand"> <span class="brand__logo" style="display:none;">{{ brandName.charAt(0) }}</span> <span class="brand__name">{{ brandName }}</span> <p class="brand__tagline text-sm text-text-secondary mt-2">{{ brandTagline }}</p> </div> <form class="card__form" (submit)="$event.preventDefault()"> 
      <div *ngIf="step === 'invite'"> <label class="field"> <span class="field__label">Lien unique d’accès</span> <input type="text" [(ngModel)]="inviteText" name="inviteText" placeholder="Collez ici le lien / le code…" /> </label> <button class="submit" type="button" (click)="parseInvite()">Valider le lien</button> </div>
      <div *ngIf="step === 'login'"> <label class="field"> <span class="field__label">Email</span> <input type="email" [(ngModel)]="email" name="email" placeholder="votre.email@exemple.com" /> </label> <label class="field"> <span class="field__label">Mot de passe</span> <input type="password" [(ngModel)]="password" name="password" placeholder="••••••••" /> </label> <button class="submit" type="button" (click)="login()">Se connecter</button> <button class="submit" type="button" style="background:#f1f5f9;color:#334155;margin-top:10px;" (click)="backToInvite()">← Retour au lien unique</button> </div>
      <p *ngIf="error" class="text-sm text-red-600 text-center">{{ error }}</p> <div class="roles"> <p class="text-xs text-text-secondary"> Astuce : ouvrez directement le lien unique (recommandé) ou collez-le ici.</p> </div> </form> </section>
</main>
