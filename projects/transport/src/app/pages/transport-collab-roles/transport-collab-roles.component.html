<main class="min-h-screen flex items-center justify-center bg-gray-50 px-4 py-12"> <div class="w-full max-w-2xl bg-white rounded-xl shadow-lg border border-gray-200 p-8"> <h1 class="text-2xl font-bold mb-2 text-text">Choix des collaborateurs</h1> <p class="text-sm text-text-secondary mb-6">Domaine sélectionné : {{ domainLabel }}</p> <div class="space-y-4"> <label *ngFor="let option of roleOptions" class="flex items-center gap-3 p-4 border rounded-lg"> <input type="checkbox" [(ngModel)]="roles[option.key]"> <div> <div class="font-medium text-text">{{ option.label }}</div> <div class="text-sm text-text-secondary">{{ option.description }}</div> </div> </label> </div> <button
      (click)="proceed()" class="mt-6 w-full py-3 bg-primary text-white rounded-lg font-medium hover:bg-primary/90"> Continuer
    </button> </div>
</main>
