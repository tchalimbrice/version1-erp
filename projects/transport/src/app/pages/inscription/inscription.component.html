<main class="signup-page"> <section class="card"> <header class="card__header"> <h1>Inscription d’Entreprise</h1> <p>Créez un compte pour votre société de transport.</p> </header> <form class="card__form"> <label class="field"> <span class="field__label">Nom de l’Entreprise</span> <input type="text" placeholder="Nom de l’Entreprise" [(ngModel)]="companyName" name="companyName" /> </label> <label class="field"> <span class="field__label">Adresse</span> <input type="text" placeholder="Adresse" [(ngModel)]="address" name="address" /> </label> <label class="field"> <span class="field__label">Numéro de Téléphone</span> <input type="tel" placeholder="Numéro de Téléphone" [(ngModel)]="phone" name="phone" /> </label> <label class="field"> <span class="field__label">Adresse Email</span> <input type="email" placeholder="Adresse Email" [(ngModel)]="email" name="email" /> </label> <label class="field"> <span class="field__label">Mot de Passe</span> <input type="password" placeholder="Mot de Passe" [(ngModel)]="password" name="password" /> </label> <label class="field"> <span class="field__label">Confirmer le Mot de Passe</span> <input type="password" placeholder="Confirmer le Mot de Passe" [(ngModel)]="confirmPassword" name="confirmPassword" /> </label> <label class="terms"> <input type="checkbox" [(ngModel)]="accepted" name="accepted" /> <span>J’accepte les Termes et Conditions</span> </label> <button class="submit" type="button" (click)="submit()">Inscrire l’Entreprise</button> <p *ngIf="error" class="text-sm text-red-600 text-center">{{ error }}</p> </form> </section>
</main>
