<main class="min-h-screen flex items-center justify-center bg-gray-50 px-4 py-12"> <div class="w-full max-w-4xl bg-white rounded-xl shadow-lg border border-gray-200 p-8"> <h1 class="text-2xl font-bold mb-2 text-text">Informations des collaborateurs</h1> <p class="text-sm text-text-secondary mb-6">Domaine sélectionné : {{ domain }}</p> <div class="grid md:grid-cols-2 gap-6"> <div *ngFor="let c of collaborators; let i = index" class="border rounded-lg p-4"> <div class="font-medium mb-3 text-text">Poste : {{ c.role }}</div> <div class="grid gap-3"> <input [(ngModel)]="c.firstName" placeholder="Prénom" class="px-3 py-2 border rounded"> <input [(ngModel)]="c.lastName" placeholder="Nom" class="px-3 py-2 border rounded"> <input [(ngModel)]="c.email" placeholder="Email" class="px-3 py-2 border rounded"> <input [(ngModel)]="c.password" type="password" placeholder="Mot de passe" class="px-3 py-2 border rounded"> </div> <div *ngIf="generated" class="mt-3 text-sm text-text-secondary"> Lien d’accès (à ouvrir directement) :
          <div class="break-all text-primary"> {{ c.inviteUrl }}
          </div> </div> </div> </div> <div *ngIf="generated && ownerInviteUrl" class="mt-6 border rounded-lg p-4 bg-gray-50"> <div class="font-medium mb-2 text-text">Lien chef d’entreprise (à conserver)</div> <div class="break-all text-primary">{{ ownerInviteUrl }}</div> </div> <div class="mt-6 flex gap-3"> <button (click)="generateLinks()" class="px-6 py-3 bg-primary text-white rounded-lg">Générer les liens</button> <button *ngIf="generated" (click)="finish()" class="px-6 py-3 bg-gray-200 rounded-lg">Terminer</button> </div> </div>
</main>
