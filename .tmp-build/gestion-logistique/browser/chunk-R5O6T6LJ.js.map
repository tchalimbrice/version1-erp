<div class="page"> <header class="page__header"> <div><h1 class="page__title">Paramètres</h1><p class="page__sub">Informations de l'entreprise</p></div> </header> <div class="card" style="max-width:600px;"> <div class="card__head"><span class="card__title"> Entreprise logistique</span></div> <div style="display:flex;flex-direction:column;gap:14px;"> <div class="field"><label class="field__label">Nom de l'entreprise</label><input [(ngModel)]="form.name" class="field__input" /></div> <div class="field"><label class="field__label">Adresse</label><input [(ngModel)]="form.address" class="field__input" /></div> <div class="fields-row"> <div class="field"><label class="field__label">Téléphone</label><input [(ngModel)]="form.phone" class="field__input" /></div> <div class="field"><label class="field__label">E-mail</label><input [(ngModel)]="form.email" type="email" class="field__input" /></div> </div> </div> <div style="margin-top:24px;display:flex;align-items:center;gap:16px;"> <button class="btn btn--primary" (click)="save()">Enregistrer</button> @if (saved()) { <span style="color:#27ae60;font-size:13px;font-weight:700;">✓ Modifications enregistrées</span> }
    </div> </div>
</div>
